spring.application.name=InstagramRipOff

# Local overrides are read from a .env file in the working directory (see .env.example).
# Every value below has a development default, so the app also starts without one.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Instagram}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Base64-encoded HMAC key used to sign JWTs. The default is for local development only.
jwt.secret=${JWT_SECRET:khE8Bn4FYuCR3164tG5hXQM+XMmdvagakKeMYE8AnxvcMOAt9Ak+HH5X0aEq0JNq}

# Optional: e-mail notification when a user is banned (Gmail requires an app password).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Optional: SMS notification when a user is banned.
twilio.accountSid=${TWILIO_ACCOUNT_SID:}
twilio.authToken=${TWILIO_AUTH_TOKEN:}
twilio.phoneNumber=${TWILIO_PHONE_NUMBER:}

scoring-service.url=${SCORING_SERVICE_URL:http://localhost:8081}
